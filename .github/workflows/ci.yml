name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USERNAME: formula_lab
  DB_PASSWORD: formula_lab

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  php:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formula_lab
          POSTGRES_PASSWORD: formula_lab
          POSTGRES_DB: formula_lab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U formula_lab"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DB_DATABASE: formula_lab_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan test

  e2e:
    runs-on: ubuntu-latest
    needs: [js, php]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formula_lab
          POSTGRES_PASSWORD: formula_lab
          POSTGRES_DB: formula_lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U formula_lab"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DATABASE: formula_lab
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/api
      - run: cp .env.example .env && php artisan key:generate && php artisan migrate --force
        working-directory: apps/api
      - run: pnpm --filter @fl/api build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
